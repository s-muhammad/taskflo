<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" dir="rtl">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="550" r="250" fill="#ffffff" opacity="0.05"/>
  <circle cx="600" cy="-50" r="300" fill="#ffffff" opacity="0.03"/>

  <!-- Decorative dots pattern -->
  <g opacity="0.1">
    <circle cx="50" cy="500" r="3" fill="white"/>
    <circle cx="90" cy="500" r="3" fill="white"/>
    <circle cx="130" cy="500" r="3" fill="white"/>
    <circle cx="50" cy="540" r="3" fill="white"/>
    <circle cx="90" cy="540" r="3" fill="white"/>
    <circle cx="130" cy="540" r="3" fill="white"/>
    <circle cx="50" cy="580" r="3" fill="white"/>
    <circle cx="90" cy="580" r="3" fill="white"/>
    <circle cx="130" cy="580" r="3" fill="white"/>
  </g>

  <!-- Main dashboard card -->
  <rect x="580" y="80" width="540" height="470" rx="24" fill="url(#card)" filter="url(#shadow)"/>

  <!-- Card header -->
  <rect x="580" y="80" width="540" height="56" rx="24" fill="#f1f5f9"/>
  <rect x="580" y="112" width="540" height="24" fill="#f1f5f9"/>
  <circle cx="612" cy="108" r="7" fill="#f87171"/>
  <circle cx="636" cy="108" r="7" fill="#fbbf24"/>
  <circle cx="660" cy="108" r="7" fill="#34d399"/>
  <text x="820" y="113" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">TaskFlow Dashboard</text>

  <!-- Stats row -->
  <rect x="604" y="152" width="155" height="90" rx="14" fill="#eef2ff"/>
  <rect x="604" y="152" width="36" height="36" rx="10" fill="#4f46e5"/>
  <text x="622" y="176" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="800">📋</text>
  <text x="604" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#6366f1" font-weight="600">کل تسک‌ها</text>
  <text x="604" y="230" font-family="system-ui, sans-serif" font-size="26" fill="#1e1b4b" font-weight="900">۲۴</text>

  <rect x="771" y="152" width="155" height="90" rx="14" fill="#ecfdf5"/>
  <rect x="771" y="152" width="36" height="36" rx="10" fill="#10b981"/>
  <text x="789" y="176" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="800">✅</text>
  <text x="771" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="600">انجام شده</text>
  <text x="771" y="230" font-family="system-ui, sans-serif" font-size="26" fill="#1e1b4b" font-weight="900">۱۸</text>

  <rect x="938" y="152" width="155" height="90" rx="14" fill="#fffbeb"/>
  <rect x="938" y="152" width="36" height="36" rx="10" fill="#f59e0b"/>
  <text x="956" y="176" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="800">⏳</text>
  <text x="938" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#f59e0b" font-weight="600">باقی‌مانده</text>
  <text x="938" y="230" font-family="system-ui, sans-serif" font-size="26" fill="#1e1b4b" font-weight="900">۶</text>

  <!-- Task list -->
  <rect x="604" y="258" width="482" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="604" y="258" width="24" height="24" rx="6" fill="none" stroke="#4f46e5" stroke-width="2.5" transform="translate(14, 14)"/>
  <text x="648" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="600">طراحی صفحه لندینگ</text>
  <rect x="1020" y="270" width="52" height="24" rx="8" fill="#fef2f2"/>
  <text x="1046" y="287" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="700">مهم</text>

  <rect x="604" y="320" width="482" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="604" y="320" width="24" height="24" rx="6" fill="#10b981" transform="translate(14, 14)"/>
  <text x="642" y="337" font-family="system-ui, sans-serif" font-size="11" fill="white" font-weight="800">✓</text>
  <text x="648" y="352" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600" text-decoration="line-through">توسعه API کاربری</text>
  <rect x="1020" y="332" width="64" height="24" rx="8" fill="#ecfdf5"/>
  <text x="1052" y="349" font-family="system-ui, sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="700">تکمیل</text>

  <rect x="604" y="382" width="482" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="604" y="382" width="24" height="24" rx="6" fill="none" stroke="#4f46e5" stroke-width="2.5" transform="translate(14, 14)"/>
  <text x="648" y="414" font-family="system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="600">بررسی نتایج تست</text>
  <rect x="1020" y="394" width="72" height="24" rx="8" fill="#fffbeb"/>
  <text x="1056" y="411" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="700">بررسی</text>

