  <text x="98" y="554" font-family="system-ui, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="900">T</text>
  <text x="128" y="554" font-family="system-ui, sans-serif" font-size="16" fill="white" font-weight="700" opacity="0.8">تسک فلو</text>
  <text x="220" y="554" font-family="system-ui, sans-serif" font-size="12" fill="#c7d2fe" opacity="0.6">taskflow.ir</text>

  <!-- Floating elements -->
  <g filter="url(#glow)" opacity="0.6">
    <circle cx="520" cy="180" r="6" fill="#818cf8"/>
    <circle cx="540" cy="350" r="4" fill="#a78bfa"/>
    <circle cx="500" cy="480" r="5" fill="#6366f1"/>
  </g>
</svg>
