  <text x="872" y="472" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600">تقویم شمسی</text>
  <g transform="translate(870, 478)">
    <text x="0" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">ش</text>
    <text x="28" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">ی</text>
    <text x="56" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">د</text>
    <text x="84" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">س</text>
    <text x="112" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">چ</text>
    <text x="140" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">پ</text>
    <text x="168" y="10" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">ج</text>
    <text x="0" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۱</text>
    <text x="28" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۲</text>
    <text x="56" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۳</text>
    <text x="84" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۴</text>
    <text x="112" y="26" font-family="system-ui, sans-serif" font-size="9" fill="white" font-weight="800">۵</text>
    <circle cx="120" cy="23" r="9" fill="#4f46e5"/>
    <text x="140" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۶</text>
    <text x="168" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۷</text>
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۸</text>
    <text x="28" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۹</text>
    <text x="56" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۱۰</text>
    <text x="84" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۱۱</text>
    <text x="112" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۱۲</text>
    <text x="140" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۱۳</text>
    <text x="168" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">۱۴</text>
  </g>

  <!-- Left side text content -->
  <!-- Badge -->
  <rect x="80" y="120" width="180" height="36" rx="18" fill="#ffffff" opacity="0.15"/>
  <text x="170" y="143" font-family="system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">✦ معرفی پروژه</text>

  <!-- Main title -->
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="42" fill="white" font-weight="900">
    <tspan x="80" dy="0">تسک فلو</tspan>
  </text>
  <text x="80" y="248" font-family="system-ui, sans-serif" font-size="42" fill="white" font-weight="900">
    <tspan x="80" dy="0">ابزار هوشمند</tspan>
  </text>
  <text x="80" y="296" font-family="system-ui, sans-serif" font-size="42" fill="url(#accent)" font-weight="900">
    <tspan x="80" dy="0">مدیریت زمان</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="17" fill="#c7d2fe" font-weight="500">با تسک فلو بهره‌وری خود را به اوج برسانید</text>
  <text x="80" y="368" font-family="system-ui, sans-serif" font-size="17" fill="#c7d2fe" font-weight="500">برنامه‌ریزی روزانه و مشاهده نمودار عملکرد</text>

  <!-- Feature pills -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="65" y="23" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">📋 مدیریت تسک</text>
  </g>
  <g transform="translate(224, 400)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="55" y="23" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">📊 گزارش‌گیری</text>
  </g>
  <g transform="translate(348, 400)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="65" y="23" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">🔔 یادآوری هوشمند</text>
  </g>
  <g transform="translate(80, 448)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="60" y="23" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">📅 تقویم شمسی</text>
  </g>
  <g transform="translate(214, 448)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="50" y="23" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">🎨 دسته‌بندی</text>
  </g>

  <!-- Bottom brand -->
